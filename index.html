<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05050b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="仓位终端">
<meta name="description" content="NEON//POS 仓位计算 · 交易手册 · 多钱包">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>NEON//POS · 仓位终端</title>
<style>
:root{
  --bg:#05050b;--panel:rgba(14,14,30,.82);--panel2:rgba(0,0,0,.38);
  --line:rgba(0,240,255,.18);
  --cyan:#00f0ff;--mag:#ff2bd6;--yel:#f8ef00;--grn:#00ff9c;--red:#ff3b6b;--vio:#8b5cff;
  --txt:#e6f4ff;--dim:#6f7d9c;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,"Roboto Mono","PingFang SC","Microsoft YaHei",monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;color:var(--txt);font-family:var(--mono);font-size:14px;line-height:1.45;
  background:radial-gradient(1100px 600px at 110% -10%,rgba(255,43,214,.16),transparent 60%),
             radial-gradient(900px 500px at -20% 10%,rgba(0,240,255,.14),transparent 60%),var(--bg);
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,240,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.055) 1px,transparent 1px);
  background-size:32px 32px;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,.15));mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,.15))}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.022) 0,rgba(255,255,255,.022) 1px,transparent 1px,transparent 3px)}
body.noscroll{overflow:hidden}
#app{position:relative;z-index:1}

/* ===== Top ===== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--sat) + 10px) 16px 10px;background:rgba(5,5,11,.78);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{font-size:17px;font-weight:900;letter-spacing:3px;line-height:1.1}
.logo .a{color:var(--cyan);text-shadow:0 0 6px var(--cyan),0 0 18px rgba(0,240,255,.6)}
.logo .s{color:var(--mag);text-shadow:0 0 6px var(--mag)}
.logo small{display:block;font-size:8.5px;letter-spacing:4px;color:var(--dim);font-weight:400;margin-top:2px}
.glitch{animation:glitch 5s infinite}
@keyframes glitch{0%,91%,100%{transform:none}92%{transform:translate(-2px,1px);text-shadow:2px 0 var(--mag),-2px 0 var(--cyan)}94%{transform:translate(2px,-1px)}96%{transform:translate(-1px,0);text-shadow:-2px 0 var(--mag),2px 0 var(--cyan)}}
.net{font-size:10px;letter-spacing:2px;padding:4px 8px;border:1px solid var(--grn);color:var(--grn)}
.net.off{border-color:var(--yel);color:var(--yel)}

main{max-width:640px;margin:0 auto;padding:14px 12px calc(var(--sab) + 96px)}
.view{display:none}.view.active{display:block;animation:vin .28s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== Card ===== */
.card{position:relative;background:var(--panel);border:1px solid var(--line);padding:14px;margin-bottom:12px;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card::before{content:"";position:absolute;top:0;left:0;width:42px;height:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.card::after{content:"";position:absolute;right:0;bottom:0;width:42px;height:2px;background:var(--mag);box-shadow:0 0 10px var(--mag)}
.label{font-size:11px;letter-spacing:2px;color:var(--cyan);opacity:.9;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}
.dim{color:var(--dim)}.up{color:var(--grn)}.down{color:var(--red)}
.neon{color:var(--cyan);text-shadow:0 0 8px rgba(0,240,255,.7)}.magc{color:var(--mag)}.warnc{color:var(--yel)}
.hero-num{font-size:34px;font-weight:900;margin:6px 0 2px;word-break:break-all;
  background:linear-gradient(90deg,var(--cyan),#b8ffff 45%,var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(0,240,255,.35))}
.hero-sub{font-size:13px;font-weight:700;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:var(--panel2);border-left:2px solid rgba(0,240,255,.5);padding:8px 10px;min-width:0}
.metric .k{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .v{font-size:15px;font-weight:700;margin-top:2px;word-break:break-all}
.metric.up{border-left-color:var(--grn)}.metric.up .v{color:var(--grn)}
.metric.down{border-left-color:var(--red)}.metric.down .v{color:var(--red)}
.metric.mag{border-left-color:var(--mag)}.metric.mag .v{color:var(--mag)}
.metric.warnc{border-left-color:var(--yel)}.metric.warnc .v{color:var(--yel)}
.kpi-main{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin-bottom:10px;padding:12px;
  background:linear-gradient(135deg,rgba(0,240,255,.12),rgba(255,43,214,.09));border:1px solid rgba(0,240,255,.35)}
.kpi-main .k{font-size:11px;color:var(--dim)}.kpi-main .v{font-size:21px;font-weight:900;word-break:break-all}

/* ===== Form ===== */
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px}
input,select,textarea{width:100%;font-family:var(--mono);font-size:16px;color:var(--txt);background:rgba(3,3,10,.88);
  border:1px solid rgba(0,240,255,.25);padding:11px 12px;outline:none;border-radius:0;-webkit-appearance:none;appearance:none;
  transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 14px rgba(0,240,255,.35)}
input::placeholder,textarea::placeholder{color:#3d4763}
select{background-image:linear-gradient(45deg,transparent 50%,var(--cyan) 50%),linear-gradient(135deg,var(--cyan) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
select option{background:#0b0b18}
textarea{resize:vertical;min-height:72px;line-height:1.5}
.inwrap{position:relative}.inwrap em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--dim);pointer-events:none}
.inwrap input{padding-right:30px}

/* ===== Buttons ===== */
button{font-family:var(--mono);cursor:pointer;border:none;background:none;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;font-size:14px;font-weight:800;letter-spacing:1px;
  color:#001014;background:var(--cyan);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{filter:grayscale(1) brightness(.45);cursor:not-allowed}
.btn.ghost{background:rgba(0,240,255,.06);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(0,240,255,.6)}
.btn.mag{background:var(--mag);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.dghost{background:rgba(255,59,107,.06);color:var(--red);box-shadow:inset 0 0 0 1px rgba(255,59,107,.6)}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.big{padding:15px 16px;font-size:15px}
.seg{display:flex;border:1px solid rgba(0,240,255,.3);margin-bottom:12px}
.seg button{flex:1;padding:11px 6px;font-size:13px;font-weight:700;color:var(--dim);letter-spacing:1px;transition:all .15s}
.seg button+button{border-left:1px solid rgba(0,240,255,.2)}
.seg button.on{color:#001014;background:var(--cyan);box-shadow:0 0 16px rgba(0,240,255,.5)}
.seg.mini{margin:0}.seg.mini button{padding:5px 10px;font-size:11px}
.seg.side{border:none;gap:10px;margin-bottom:4px}
.seg.side button{padding:16px 6px;font-size:15px;font-weight:900}
.seg.side button.long{border:1px solid rgba(0,255,156,.45);color:rgba(0,255,156,.65)}
.seg.side button.short{border:1px solid rgba(255,59,107,.45);color:rgba(255,59,107,.65)}
.seg.side button.long.on{background:var(--grn);color:#00140b;box-shadow:0 0 22px rgba(0,255,156,.55)}
.seg.side button.short.on{background:var(--red);color:#fff;box-shadow:0 0 22px rgba(255,59,107,.55)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.chip{padding:6px 10px;font-size:12px;border:1px solid rgba(255,43,214,.35);color:#e0b3ff}
.chip.on{background:var(--mag);color:#fff;border-color:var(--mag);box-shadow:0 0 12px rgba(255,43,214,.6)}
.adv-toggle{width:100%;text-align:left;padding:10px 0 6px;color:var(--dim);font-size:12px;border-top:1px dashed rgba(0,240,255,.2);margin-top:4px}
.adv{display:none;padding-top:8px}.adv.open{display:block}
.entry{display:grid;grid-template-columns:30px 1fr 92px 36px;gap:6px;align-items:center;margin-bottom:8px}
.eidx{font-size:12px;color:var(--mag);font-weight:900}
.x{width:36px;height:44px;color:var(--red);border:1px solid rgba(255,59,107,.35);font-size:14px}
.x.ph{border:none}
.winfo{font-size:12px;color:var(--dim);margin:-4px 0 12px;padding:8px 10px;background:var(--panel2);border-left:2px solid var(--mag)}
.winfo b{color:var(--txt)}
.alert{padding:9px 11px;font-size:12.5px;margin-top:8px;border-left:3px solid;line-height:1.55}
.alert.err{border-color:var(--red);background:rgba(255,59,107,.1);color:#ffb3c4}
.alert.warn{border-color:var(--yel);background:rgba(248,239,0,.07);color:#fff7a0}
.alert.ok{border-color:var(--grn);background:rgba(0,255,156,.07);color:#a8ffd9}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.tbl th{color:var(--dim);font-weight:400;text-align:right;padding:6px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.04)}
.tbl th:first-child,.tbl td:first-child{text-align:left;color:var(--mag)}
.formula{font-size:11px;color:var(--dim);margin-top:10px;padding:8px 10px;border:1px dashed rgba(0,240,255,.2);line-height:1.75}
.formula b{color:var(--cyan);font-weight:400}
.exec-bar{position:sticky;bottom:calc(var(--sab) + 68px);z-index:5;display:grid;grid-template-columns:1fr 2.4fr;gap:10px;padding:10px 0 4px;
  background:linear-gradient(to top,rgba(5,5,11,.95) 60%,transparent)}

/* ===== Tabbar ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 6px calc(var(--sab) + 6px);background:rgba(5,5,11,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11px;position:relative}
.tab i{font-style:normal;font-size:20px;line-height:1}
.tab.active{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
.tab.active::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}

/* ===== Wallet ===== */
.w-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.w-name{font-size:16px;font-weight:800}
.ccy{font-size:10px;padding:2px 6px;border:1px solid var(--mag);color:var(--mag);margin-left:6px;vertical-align:middle;letter-spacing:1px}
.w-bal{font-size:20px;font-weight:900;text-align:right;word-break:break-all}
.w-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.w-actions button{padding:9px 0;font-size:12px;border:1px solid rgba(0,240,255,.25);color:var(--cyan)}
.w-actions button.d{color:var(--red);border-color:rgba(255,59,107,.3)}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px;font-size:12px;letter-spacing:2px;color:var(--mag)}
.empty{text-align:center;padding:30px 16px}
.empty .big{font-size:22px;font-weight:900;color:var(--yel);text-shadow:0 0 12px rgba(248,239,0,.5);margin-bottom:8px;letter-spacing:2px}
.empty p{color:var(--dim);margin-bottom:16px;font-size:13px}
.rate{margin-top:12px;font-size:12px;color:var(--cyan);padding:9px 10px;border:1px dashed rgba(0,240,255,.3);cursor:pointer}
.spark{width:100%;height:90px;display:block;margin-top:10px}

/* ===== Trade ===== */
.trade{border-left:3px solid var(--grn)}.trade.short{border-left-color:var(--red)}
.t-head{display:flex;justify-content:space-between;gap:10px;cursor:pointer;margin-bottom:10px}
.t-sym{font-size:16px;font-weight:900;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.t-meta{font-size:11px;color:var(--dim);margin-top:4px}
.t-right{text-align:right;flex-shrink:0}
.t-pnl{font-size:16px;font-weight:900;margin-top:5px}.t-r{font-size:11px;color:var(--dim)}
.badge{font-size:10px;padding:2px 6px;letter-spacing:1px;font-weight:800}
.badge.long{background:var(--grn);color:#00140b}.badge.short{background:var(--red);color:#fff}
.badge.lev{border:1px solid var(--yel);color:var(--yel);font-weight:400}
.status{font-size:10px;padding:2px 7px;border:1px solid;letter-spacing:1px;display:inline-block}
.s-open{color:var(--cyan);border-color:var(--cyan);animation:pulse 1.6s infinite}
.s-closed{color:var(--dim);border-color:var(--dim)}
.s-cancel{color:#666;border-color:#444;text-decoration:line-through}
@keyframes pulse{50%{box-shadow:0 0 10px var(--cyan)}}
.t-detail{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(0,240,255,.2)}
.t-more{font-size:11px;text-align:center;margin-top:8px;color:var(--dim);cursor:pointer}
.t-text{font-size:12.5px;white-space:pre-wrap;word-break:break-word;padding:8px 10px;background:var(--panel2);border-left:2px solid var(--vio);margin-top:8px}
.t-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.t-actions .btn{flex:1 1 30%}
.filter{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.filter button{flex-shrink:0;padding:7px 12px;font-size:12px;border:1px solid rgba(0,240,255,.25);color:var(--dim)}
.filter button.on{color:#001014;background:var(--cyan)}

/* ===== Modal / Toast ===== */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,5,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{width:100%;max-width:640px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#0e0e22,#07070f);border-top:2px solid var(--cyan);box-shadow:0 -10px 40px rgba(0,240,255,.25);
  padding:10px 16px calc(var(--sab) + 18px);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-bar{width:44px;height:4px;background:rgba(0,240,255,.4);margin:0 auto 12px}
.m-title{font-size:17px;margin-bottom:14px;color:var(--cyan);letter-spacing:1px}
.m-msg{font-size:13.5px;line-height:1.75;margin-bottom:14px}
.m-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:8px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid rgba(0,240,255,.2);margin-bottom:6px;font-size:13px}
.chk input{width:18px;height:18px;flex-shrink:0;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--cyan);padding:0}
.preview{padding:10px;background:var(--panel2);border-left:2px solid var(--cyan);font-size:13px;margin-bottom:12px;line-height:1.75}
.flow-row{display:grid;grid-template-columns:auto auto 1fr 30px;gap:8px;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.flow-row .x{width:28px;height:28px}
.dump{min-height:220px;font-size:11px}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 14px);transform:translate(-50%,-20px);opacity:0;z-index:90;padding:10px 16px;font-size:13px;
  background:#0b0b1a;border:1px solid var(--cyan);color:var(--cyan);box-shadow:0 0 20px rgba(0,240,255,.4);transition:all .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--red);color:var(--red);box-shadow:0 0 20px rgba(255,59,107,.4)}
.storage{font-size:12px;padding:9px 10px;margin-bottom:10px;line-height:1.5}
.storage.ok{color:var(--grn);background:rgba(0,255,156,.06)}.storage.err{color:var(--red);background:rgba(255,59,107,.08)}
.btn-col{display:grid;gap:8px}
.foot{text-align:center;font-size:10px;color:var(--dim);letter-spacing:2px;padding:10px 0 20px}
.help{font-size:12px;color:var(--dim);line-height:1.85}.help b{color:var(--cyan);font-weight:400}
@media (max-width:360px){.grid3{grid-template-columns:1fr 1fr}.hero-num{font-size:28px}.entry{grid-template-columns:26px 1fr 80px 34px}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="logo glitch"><span class="a">NEON</span><span class="s">//</span>POS<small>POSITION TERMINAL</small></div>
    <span id="net" class="net">● ONLINE</span>
  </header>
  <main>
    <section id="view-dash" class="view active"></section>
    <section id="view-calc" class="view"></section>
    <section id="view-journal" class="view"></section>
    <section id="view-set" class="view"></section>
  </main>
  <nav class="tabbar">
    <button class="tab active" data-act="go" data-v="dash"><i>◈</i><span>资产</span></button>
    <button class="tab" data-act="go" data-v="calc"><i>⌖</i><span>计算</span></button>
    <button class="tab" data-act="go" data-v="journal"><i>▤</i><span>手册</span></button>
    <button class="tab" data-act="go" data-v="set"><i>⚙</i><span>设置</span></button>
  </nav>
</div>
<div id="modal" class="modal hidden"><div class="sheet"><div class="sheet-bar"></div><div id="modal-body"></div></div></div>
<div id="toast"></div>
<noscript><div style="padding:20px;color:#ff3b6b">需要启用 JavaScript</div></noscript>

<script>
(function(){
'use strict';
const APP_KEY='neonpos.data.v1', DRAFT_KEY='neonpos.draft.v1', VERSION='1.0.0';

/* ================= 存储层（沙箱 / 隐私模式自动降级为内存） ================= */
const Store=(function(){
  let ok=false; const mem={};
  try{ const ls=window.localStorage; const k='__neon_t'; ls.setItem(k,'1'); ls.removeItem(k); ok=true; }catch(e){ ok=false; }
  return {
    ok,
    get(k){ if(ok){ try{ return window.localStorage.getItem(k); }catch(e){} } return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null; },
    set(k,v){ mem[k]=v; if(ok){ try{ window.localStorage.setItem(k,v); return true; }catch(e){ return false; } } return true; },
    del(k){ delete mem[k]; if(ok){ try{ window.localStorage.removeItem(k); }catch(e){} } }
  };
})();

/* ================= 工具 ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const isNum=n=>typeof n==='number'&&isFinite(n);
function num(v){ if(v===null||v===undefined) return NaN; const s=String(v).replace(/,/g,'').trim(); if(s==='') return NaN; const n=Number(s); return isFinite(n)?n:NaN; }
const nn=v=>isNum(v)?v:null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(n,dp){ dp=dp==null?2:dp; if(!isNum(n)) return '--'; return n.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function fmtP(n){ if(!isNum(n)) return '--'; const a=Math.abs(n); const dp=a>=1000?2:a>=1?4:a>=0.01?6:8; return n.toLocaleString('en-US',{maximumFractionDigits:dp}); }
function fmtQ(n){ if(!isNum(n)) return '--'; const a=Math.abs(n); const dp=a>=1000?2:a>=1?4:8; return n.toLocaleString('en-US',{maximumFractionDigits:dp}); }
function fmtPct(n,dp){ dp=dp==null?2:dp; return isNum(n)?(n*100).toFixed(dp)+'%':'--'; }
const SYM={USDT:'₮',CNY:'¥'};
function money(n,ccy,dp){ if(!isNum(n)) return '--'; return (n<0?'-':'')+(SYM[ccy]||'')+fmt(Math.abs(n),dp); }
function signMoney(n,ccy){ if(!isNum(n)) return '--'; return (n>0?'+':n<0?'-':'')+(SYM[ccy]||'')+fmt(Math.abs(n)); }
const pn=v=>!isNum(v)?'':v>=0?'up':'down';
function dt(ts){ if(!ts) return '--'; const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function m(k,v,cls){ return '<div class="metric '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

  st.rate=num(st.rate)>0?num(st.rate):7.2; st.displayCcy=st.displayCcy==='CNY'?'CNY':'USDT';
  return {

    trades:(Array.isArray(d.trades)?d.trades:[]).filter(t=>t&&t.id&&t.calc&&Array.isArray(t.entries)).map(t=>Object.assign({},t,{entries:t.entries.map(e=>({price:Number(e.price),weight:Number(e.weight)}))}))

const findW=id=>S.wallets.find(w=>w.id===id);
const findT=id=>S.trades.find(t=>t.id===id);
const tccy=t=>t.ccy||(findW(t.walletId)||{}).ccy||'USDT';
function conv(a,from,to){ if(!isNum(a)) return 0; if(from===to) return a; const r=S.settings.rate||7.2; return from==='USDT'&&to==='CNY'?a*r:a/r; }

function walletStats(w){
  const flows=S.flows.filter(f=>f.walletId===w.id).reduce((a,f)=>a+f.amount,0);
  const ts=S.trades.filter(t=>t.walletId===w.id);
  const closed=ts.filter(t=>t.status==='closed'), open=ts.filter(t=>t.status==='open');
  const realized=closed.reduce((a,t)=>a+(Number(t.realizedPnl)||0),0);
  const usedMargin=open.reduce((a,t)=>a+(Number(t.calc.margin)||0),0);
  const base=w.initial+flows, balance=base+realized;
  return {flows,base,realized,usedMargin,balance,available:balance-usedMargin,openCount:open.length,closedCount:closed.length,pnlPct:base>0?realized/base:NaN};
}
function totals(){
  const d=S.settings.displayCcy; let bal=0,real=0,used=0,avail=0,open=0;
  S.wallets.forEach(w=>{ const s=walletStats(w); bal+=conv(s.balance,w.ccy,d); real+=conv(s.realized,w.ccy,d); used+=conv(s.usedMargin,w.ccy,d); avail+=conv(s.available,w.ccy,d); open+=s.openCount; });
  return {bal,real,used,avail,open,d};
}
function journalStats(wid){
  const d=wid==='all'?S.settings.displayCcy:((findW(wid)||{}).ccy||'USDT');
  const closed=S.trades.filter(t=>t.status==='closed'&&(wid==='all'||t.walletId===wid)).sort((a,b)=>(a.closedAt||0)-(b.closedAt||0));
  let wins=0,gw=0,gl=0,sumR=0,nR=0,cum=0,peak=0,mdd=0; const pts=[0];
  closed.forEach(t=>{
    const raw=Number(t.realizedPnl)||0, p=conv(raw,tccy(t),d);
    if(p>0){wins++;gw+=p;} else gl+=-p;
    if(t.calc&&t.calc.risk>0){ sumR+=raw/t.calc.risk; nR++; }
    cum+=p; pts.push(cum); peak=Math.max(peak,cum); mdd=Math.max(mdd,peak-cum);
  });
  return {ccy:d,n:closed.length,wins,winRate:closed.length?wins/closed.length:NaN,total:cum,avgR:nR?sumR/nR:NaN,pf:gl>0?gw/gl:(gw>0?Infinity:NaN),mdd,pts};
}

/* ================= 核心计算引擎 ================= */
/* 分批占比 = 各批「仓位价值」占比；加权均价 = 总价值 / 总数量（调和加权）
   风险模式：仓位价值 N = 风险预算 / (止损距离d + 开仓费率 + 平仓费率×止损价/均价)
   保证金模式：N = 权益×% × 杠杆
   强平价（线性U本位近似）：多 P=(N−C)/(Q×(1−MMR))；空 P=(N+C)/(Q×(1+MMR))；C=逐仓保证金 / 全仓可用余额 */
function compute(inp,equity,available){
  const R={ok:false,errors:[],warns:[],dangers:[]};
  const side=inp.side==='short'?-1:1;
  const lev=isNum(inp.lev)&&inp.lev>=1?inp.lev:1;
  R.lev=lev; R.isContract=lev>1; R.side=side;
  const f=(isNum(inp.fee)&&inp.fee>=0?inp.fee:0)/100;
  const mmr=(isNum(inp.mmr)&&inp.mmr>=0?inp.mmr:0)/100;
  if(!(equity>0)) R.errors.push('钱包权益 ≤ 0，请先设置本金或入金');
  if(!(isNum(inp.pct)&&inp.pct>0)) R.errors.push(inp.mode==='risk'?'请填写单笔风险 %':'请填写保证金占比 %');
  if(isNum(inp.lev)&&inp.lev<1) R.errors.push('杠杆需 ≥ 1');
  const es=inp.entries.map((e,i)=>({i,price:e.price,weight:e.weight})).filter(e=>isNum(e.price)&&e.price>0);
  if(!es.length){ R.errors.push('请填写至少一个入场价'); return R; }
  const wv=e=>isNum(e.weight)&&e.weight>0?e.weight:0;
  const wsum=es.reduce((a,e)=>a+wv(e),0);
  es.forEach(e=>{ e.w=wsum>0?wv(e)/wsum:1/es.length; });
  if(wsum<=0) R.warns.push('未填写批次占比，已按均分计算');
  else if(Math.abs(wsum-100)>0.01) R.warns.push('批次占比合计 '+fmt(wsum,2)+'%，已自动归一化为 100%');
  if(es.length<inp.entries.length) R.warns.push('部分批次未填入场价，已忽略');
  if(es.some(e=>e.w===0)) R.warns.push('存在占比为 0 的批次');
  const avg=1/es.reduce((a,e)=>a+e.w/e.price,0); R.avg=avg;
  const stop=inp.stop, hasStop=isNum(stop)&&stop>0; let d=NaN;
  if(hasStop){
    d=side*(avg-stop)/avg;
    if(d<=0) R.errors.push(side>0?'做多：止损价必须低于入场均价':'做空：止损价必须高于入场均价');
    else es.forEach(e=>{ if(side*(e.price-stop)<=0) R.errors.push('第 '+(e.i+1)+' 批入场价已越过止损价'); });
  } else if(inp.mode==='risk') R.errors.push('风险模式需填写止损价（全部批次共用）');
  else R.warns.push('未设置止损：无法评估风险与强平安全性');
  if(R.errors.length) return R;

  let N;
  if(inp.mode==='risk'){ R.riskBudget=equity*inp.pct/100; N=R.riskBudget/(d+f*(1+stop/avg)); }
  else { R.marginBudget=equity*inp.pct/100; N=R.marginBudget*lev; }
  const qty=N/avg, margin=N/lev;
  Object.assign(R,{N,qty,margin,d,stop:hasStop?stop:NaN,equity});
  R.feeOpen=f*N;
  if(hasStop){ R.feeStop=f*qty*stop; R.loss=qty*Math.abs(avg-stop)+R.feeOpen+R.feeStop; R.lossPct=R.loss/equity; R.roeStop=-R.loss/margin; }
  const tp=inp.tp;
  if(isNum(tp)&&tp>0){
    if(side*(tp-avg)<=0) R.warns.push(side>0?'做多：止盈价应高于均价（已忽略）':'做空：止盈价应低于均价（已忽略）');
    else{
      R.tp=tp; R.feeTp=f*qty*tp; R.profit=qty*Math.abs(tp-avg)-R.feeOpen-R.feeTp; R.roeTp=R.profit/margin; R.profitPct=R.profit/equity;
      if(hasStop){ R.rr=Math.abs(tp-avg)/Math.abs(avg-stop); R.rrNet=R.profit/R.loss; if(R.rr<1.5) R.warns.push('盈亏比 1:'+R.rr.toFixed(2)+' 偏低（建议 ≥ 1.5）'); }
    }
  }
  let cN=0,cQ=0;
  R.batches=es.map(e=>{ const n=N*e.w,q=n/e.price; cN+=n; cQ+=q; return {i:e.i,price:e.price,w:e.w,n,q,m:n/lev,cumAvg:cN/cQ,loss:hasStop?q*Math.abs(e.price-stop):NaN}; });

  if(lev>1){
    const Cc=inp.marginMode==='cross'?Math.max(available,margin):margin;
    R.collateral=Cc;
    const liq=side>0?(N-Cc)/(qty*(1-mmr)):(N+Cc)/(qty*(1+mmr));
    R.liq=liq>0?liq:NaN;
    if(hasStop){
      if(isNum(R.liq)){
        if(side*(R.liq-stop)>=0) R.dangers.push('⚠ 强平价 '+fmtP(R.liq)+' 会先于止损 '+fmtP(stop)+' 触发！请降低杠杆 / 改全仓 / 追加保证金');
        else if(Math.abs(R.liq-stop)/avg<0.01) R.warns.push('强平价距止损不足 1%，插针风险较高');
      }
      const r=stop/avg, den=side>0?1-r*(1-mmr):r*(1+mmr)-1;
      R.safeLev=den>0?1/den:Infinity;
    }
  }
  if(margin>available) R.dangers.push('所需保证金 '+fmt(margin)+' 超出钱包可用余额 '+fmt(available));
  if(inp.mode==='margin'&&hasStop&&R.lossPct>0.05) R.warns.push('止损将亏损权益的 '+fmtPct(R.lossPct)+'，超过 5%');
  if(inp.mode==='risk'&&inp.pct>5) R.warns.push('单笔风险 > 5%，属于激进仓位');
  if(lev>=50) R.warns.push('杠杆 ≥ 50x：交易所阶梯维持保证金率会更高，实际强平价更近');
  R.ok=true; return R;
}
function closePnl(t,exit,fills){
  const f=(Number(t.fee)||0)/100; let N=0,q=0;
  t.entries.forEach((e,i)=>{ if(fills.indexOf(i)>-1){ const n=t.calc.N*e.weight/100; N+=n; q+=n/e.price; } });
  if(!(q>0)||!isNum(exit)) return {pnl:0,fees:0,N:0,q:0,avg:NaN};
  const avg=N/q, side=t.side==='short'?-1:1;
  const fees=f*N+f*q*exit;
  return {pnl:side*q*(exit-avg)-fees,fees,N,q,avg};
}

function sparkSVG(pts){
  const W=320,H=90,P=6; const min=Math.min(0,...pts), max=Math.max(0,...pts), rng=(max-min)||1;
  const x=i=>P+(W-2*P)*i/Math.max(1,pts.length-1), y=v=>H-P-(H-2*P)*(v-min)/rng;
  const line=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join('');
  const area=line+'L'+x(pts.length-1).toFixed(1)+','+y(0).toFixed(1)+'L'+x(0).toFixed(1)+','+y(0).toFixed(1)+'Z';
  const c=pts[pts.length-1]>=0?'#00ff9c':'#ff3b6b', gid='g'+Math.random().toString(36).slice(2,8);
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c+'" stop-opacity=".38"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></linearGradient></defs>'
    +'<line x1="0" x2="'+W+'" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+'" stroke="rgba(255,255,255,.2)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>'
    +'<path d="'+area+'" fill="url(#'+gid+')"/><path d="'+line+'" fill="none" stroke="'+c+'" stroke-width="2" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 4px '+c+')"/></svg>';
}

   +'<div class="m-actions"><button class="btn ghost" data-m="cancel">取消</button><button class="btn" data-m="ok">确认平仓</button></div>',b=>{

function download(name,content,type){
  try{
    const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; a.rel='noopener'; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1500); toast('已导出 '+name);
  }catch(e){ dumpModal(content); }
}
function dumpModal(content){
  openModal('<h3 class="m-title">手动复制保存</h3><textarea class="dump" readonly>'+esc(content)+'</textarea><div class="m-actions"><button class="btn ghost" data-m="cancel">关闭</button><button class="btn" data-m="copy">复制</button></div>',b=>{
    $('[data-m=cancel]',b).onclick=closeModal;
    $('[data-m=copy]',b).onclick=()=>{ const ta=$('.dump',b); ta.select(); try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('请长按手动复制','err'); } };
  });
}
const stamp=()=>{ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes()); };
function importFile(e){
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d||!Array.isArray(d.wallets)) throw new Error('文件格式不正确');
      const nd=migrate(d);
      confirmBox('导入将<b class="down">覆盖</b>当前全部数据：<br>钱包 '+nd.wallets.length+' · 交易 '+nd.trades.length+' · 流水 '+nd.flows.length,()=>{
        S=nd; save(); C=newCalc(); saveDraft(); toast('导入成功'); render();
      },{danger:true,yes:'覆盖导入'});
    }catch(err){ toast('导入失败：'+err.message,'err'); }
    e.target.value='';
  };
  rd.readAsText(file);
}
const csvCell=v=>{ v=v==null?'':String(v); return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
const rnd=(v,dp)=>isNum(v)?+v.toFixed(dp==null?4:dp):'';
function exportCsv(){
  if(!S.trades.length){ toast('暂无交易记录','err'); return; }
  const head=['创建时间','钱包','币种','标的','方向','仓位模式','比例%','杠杆','保证金模式','分批(价格@占比)','加权均价','止损','止盈','仓位价值','数量','保证金','计划风险','计划盈利','R:R','预估强平','状态','平仓方式','平仓价','平仓时间','实际盈亏','R倍数','手续费','入场理由','复盘'];
  const rows=S.trades.slice().sort((a,b)=>a.createdAt-b.createdAt).map(t=>{
    const w=findW(t.walletId), c=t.calc||{}, closed=t.status==='closed';
    return [dt(t.createdAt),w?w.name:'',tccy(t),t.symbol,t.side==='long'?'做多':'做空',t.mode==='risk'?'风险%':'保证金%',t.pct,t.lev,
      ({isolated:'逐仓',cross:'全仓',spot:'现货'})[t.marginMode]||'',t.entries.map(e=>e.price+'@'+e.weight.toFixed(2)+'%').join(' | '),
      rnd(c.avg,8),t.stop==null?'':t.stop,t.tp==null?'':t.tp,rnd(c.N,2),rnd(c.qty,8),rnd(c.margin,2),rnd(c.risk,2),rnd(c.profit,2),isNum(c.rr)?c.rr.toFixed(2):'',rnd(c.liq,8),
      ({open:'持仓中',closed:'已平仓',cancelled:'已取消'})[t.status]||'',closed?(({tp:'止盈',sl:'止损',manual:'手动'})[t.exitType]||''):'',closed&&t.exitPrice!=null?t.exitPrice:'',closed?dt(t.closedAt):'',
      closed?rnd(t.realizedPnl,2):'',closed&&c.risk>0?((t.realizedPnl||0)/c.risk).toFixed(2):'',closed?rnd(t.fees,2):'',t.reason||'',t.review||''];
  });
  download('neonpos-trades-'+stamp()+'.csv','\ufeff'+[head].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
}

  exportCsv:()=>exportCsv(),
  clearAll:()=>confirmBox('<b class="down">清空全部钱包、交易与流水？</b><br>此操作不可恢复，建议先导出备份。',()=>{
    confirmBox('最后确认：真的清空吗？',()=>{ S=migrate(null); save(); C=newCalc(); saveDraft(); toast('已清空'); go('dash'); },{danger:true,yes:'彻底清空'});
  },{danger:true,yes:'继续'}),
  install:async()=>{ if(!deferredPrompt){ toast('请使用浏览器菜单「添加到主屏幕」'); return; } deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; renderSettings(); }
};
function onClick(e){
  const a=e.target.closest('[data-act]'); if(!a||a.disabled) return;
  const fn=ACT[a.dataset.act]; if(!fn) return;
  e.preventDefault();
  try{ fn(a,a.dataset.id); }catch(err){ console.error(err); toast('操作出错：'+err.message,'err'); }
}
const FIELD_MAP={'c-symbol':'symbol','c-pct':'pct','c-lev':'lev','c-mmr':'mmr','c-fee':'fee','c-stop':'stop','c-tp':'tp','c-reason':'reason'};
function onCalcInput(e){
  const t=e.target;
  if(t.dataset.k){ const i=+t.dataset.i; if(C.entries[i]) C.entries[i][t.dataset.k]=t.value; }
  else{ const k=FIELD_MAP[t.id]; if(!k) return; C[k]=t.value; if(k==='lev'||k==='pct') syncChips(); }
  saveDraft();
  if(t.id!=='c-reason'&&t.id!=='c-symbol') updateCalc();
}
function updNet(){ const n=$('#net'); if(!n) return; const on=navigator.onLine!==false; n.textContent=on?'● ONLINE':'● OFFLINE'; n.classList.toggle('off',!on); }
function registerSW(){
  try{
    if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.isSecureContext){
      window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('SW 注册失败',err)); });
    }
  }catch(e){ console.warn(e); }
}

/* ================= 启动 ================= */
function init(){
  document.addEventListener('click',onClick);
  $('#view-calc').addEventListener('input',onCalcInput);
  $('#view-calc').addEventListener('change',e=>{ if(e.target.id==='c-wallet'){ C.walletId=e.target.value; saveDraft(); updateCalc(); } });
  $('#view-journal').addEventListener('change',e=>{ if(e.target.id==='j-wallet'){ J.w=e.target.value; renderJournal(); } });
  $('#modal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeModal(); });
  window.addEventListener('online',updNet); window.addEventListener('offline',updNet); updNet();
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; if(curView==='set') renderSettings(); });
  window.addEventListener('error',e=>{ console.error(e.error||e.message); });
  go('dash');
  if(!Store.ok) setTimeout(()=>toast('⚠ 本地存储不可用：临时模式，请导出备份','err'),700);
  if(!S.wallets.length) setTimeout(()=>walletModal(null,true),450);
  registerSW();
}
try{ init(); }
catch(e){ console.error(e); document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:auto 0 0 0;padding:16px;background:#1a0008;color:#ff3b6b;font-family:monospace;z-index:999">启动失败：'+esc(e&&e.message)+'</div>'); }
})();
</script>
</body>
</html>
